name: Schema impact

on:
  pull_request:
    paths:
      - 'fixtures/studio/**'
      - 'action.yml'
      - 'src/**'
      - '.github/workflows/schema-impact.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  schema-impact:
    name: Schema impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      # Installs the fixture Studio workspace too, so its node_modules exist for the check.
      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: ./
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET }}
        with:
          studio: fixtures/studio
